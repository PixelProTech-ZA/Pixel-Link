<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Pixel Link — PixelProTech Solutions</title>
<meta name="description" content="Securely connect and sync your desktop and phone — files, clipboard, notes, camera, and more, peer-to-peer.">
<meta name="theme-color" content="#0A0A0F">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M9 15l3-3M15 9l-3 3"/><path d="M12.5 6.5l1.5-1.5a3.5 3.5 0 015 5L17.5 11.5"/><path d="M11.5 17.5L10 19a3.5 3.5 0 01-5-5l1.5-1.5"/></svg>
      </div>
      <div class="brand-text">
        <div class="name">Pixel Link</div>
        <div class="sub" id="device-name-label">This device</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="status-pill" id="status-pill"><span class="dot"></span><span>Not linked</span></div>
      <button class="icon-btn" data-go="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.6V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9c.4.2.9.4 1.6.4H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1.6z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Primary">
      <div class="rail-top" id="rail-nav"></div>
    </nav>

    <main class="view-port" id="main-view" role="main"></main>
  </div>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Primary"></nav>
  <div class="toast-stack" id="toast-stack"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>
<script type="module" src="./app.js"></script>
</body>
</html>
